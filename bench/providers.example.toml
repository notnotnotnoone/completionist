# Candidates for `typer-bench`. Copy to providers.toml, set each API key in an environment variable
# (setx NAME "value" in a terminal, then open a new one), and run:
#   cd engine && uv run typer-bench ../bench/providers.toml --json ../bench/results.json
#
# The provider must speak the OpenAI-style POST {base_url}/completions with streaming. DeepSeek's FIM
# endpoint (under /beta) does. Providers that only offer chat endpoints, or a different FIM path,
# need a small adapter first.

[[provider]]
name = "deepseek-fim"
base_url = "https://api.deepseek.com/beta"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
fim = true
price_input_per_m = 0.30
price_cached_per_m = 0.006
price_output_per_m = 1.20

# [[provider]]
# name = "deepseek-plain"        # same model without the text after the caret, to see what FIM adds
# base_url = "https://api.deepseek.com/beta"
# model = "deepseek-chat"
# api_key_env = "DEEPSEEK_API_KEY"
# fim = false

# OpenRouter: one key (OPENROUTER_API_KEY) for many models. It documents a legacy `prompt` endpoint but no
# `suffix`, so these run prefix-only (fim = false). Typer then holds phrases back while text follows the
# caret on the same line. UNTESTED: whether a given model accepts /completions, and its price, are things
# this benchmark exists to find out. Check prices on openrouter.ai/models and edit the numbers below.
[[provider]]
name = "openrouter-codestral"
base_url = "https://openrouter.ai/api/v1"
model = "mistralai/codestral-2508"
api_key_env = "OPENROUTER_API_KEY"
fim = false
price_input_per_m = 0.30
price_cached_per_m = 0.30
price_output_per_m = 0.90

[[provider]]
name = "openrouter-deepseek"
base_url = "https://openrouter.ai/api/v1"
model = "deepseek/deepseek-chat"
api_key_env = "OPENROUTER_API_KEY"
fim = false
price_input_per_m = 0.30
price_cached_per_m = 0.30
price_output_per_m = 1.20
