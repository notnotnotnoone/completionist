[project]
name = "completionist-engine"
version = "0.1.0"
description = "Completionist engine: word and phrase suggestions served to the TSF text service over a named pipe"
readme = "README.md"
authors = [
    { name = "Daniel", email = "lidaniel645@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "wordfreq>=3.1.1",
]

[project.scripts]
completionist-engine = "completionist_engine.app:main"
completionist-probe = "completionist_engine.probe:main"
completionist-build-ngrams = "completionist_engine.build_ngrams:main"
completionist-bench = "completionist_engine.bench:main"
completionist-stats = "completionist_engine.stats_cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
